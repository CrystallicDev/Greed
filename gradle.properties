# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# JDK utilisé pour LANCER Gradle (piège JAVA_HOME : le défaut système est un JDK 8).
# La toolchain compile en Java 21 (auto-provisionnée via foojay).
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# Parchment mappings (https://parchmentmc.org/docs/getting-started)
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

## Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.242

## Mod Properties
mod_id=greed
mod_name=Greed
mod_license=MIT
mod_version=1.1.0
mod_group_id=com.natsu.greed
mod_authors=Natsu91
mod_description=Rework of some basic Minecraft mechanics, to make the game more balanced
